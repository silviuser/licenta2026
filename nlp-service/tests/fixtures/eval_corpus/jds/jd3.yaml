raw_text: "Junior Fullstack Developer - BearingPoint\n\nPrimary Functions And Tasks\n\nFrontend Development\n\nHTML/CSS: Created\
  \ and maintained web pages using HTML and CSS, following existing designs and style guidelines. Ensured basic responsiveness\
  \ and cross-browser compatibility.\nJavaScript: Assisted in implementing client-side functionality and fixing minor bugs\
  \ in existing codebases. Worked with simple scripts and basic DOM manipulation.\n\nBackend Development\n\nPHP: Supported\
  \ backend development by modifying existing features, debugging issues, and assisting with API integrations.\nMSSQL: Wrote\
  \ basic SQL queries for data retrieval and updates, and assisted with routine database maintenance tasks.\n\nSystems & Infrastructure\n\
  \nLinux: Performed basic operations in Linux environments, including running commands, handling deployments, and checking\
  \ application logs.\nCertificates (SSL/TLS): Assisted with the installation, configuration, and renewal of SSL/TLS certificates\
  \ following documented procedures.\nSSO (Single Sign-On): Supported SSO configuration and troubleshooting by following established\
  \ authentication flows and technical documentation.\n\nWe are looking for: \n\n Frontend: HTML/CSS, basic JavaScript (DOM\
  \ manipulation, bug fixing, simple client‑side logic)\n Backend: PHP maintenance and feature updates, basic MSSQL queries\n\
  \ Systems & Infrastructure: basic Linux operations, deployments, log checks\n Security & Identity: support for SSL/TLS certificate\
  \ handling and SSO configuration following existing documentation\n\nOffer\n\nCompensation package:\n\nOur compensation\
  \ package includes a fixed salary with yearly evaluation and performance-related bonus, meal tickets, Easter and Christmas\
  \ gift vouchers, as well as seniority, referral bonus, and peer-to-peer recognition. \n\nHealth And Wellbeing\n\nOur benefits\
  \ package includes extra paid vacation days, hybrid working model, quality private medical subscription for employee and\
  \ their families, and gym options. \n\n Professional Growth\n\nA learning-oriented organization with customized training\
  \ paths (a mix between technical, functional and soft skills, as well as German and French language courses), certifications,\
  \ valuable e-learning solution and firm-wide development programs. \n\n \n\nFor More Information, Please Visit\n\nwww.bearingpoint.com\
  \ \nwww.linkedin.com/company/bearingpoint \ninstagram.com/bearingpointromania \nfacebook.com/BearingPointRomania \n\n About\
  \ BearingPoint\n\nBearingPoint is an independent management and technology consultancy with European roots and a global\
  \ reach. We help businesses transform by combining deep industry expertise with strong capabilities in strategy, operations,\
  \ and technology. Dedicated SAP and Microsoft transformation units, a strong focus on AI, and outcome-based products enable\
  \ us to provide tailored, innovative solutions that create measurable and sustainable value.\n\nIn addition to our core\
  \ consulting operations, we run two joint ventures. Arcwide, our joint venture with IFS, specializes in business transformation\
  \ enabled by IFS technology. BearingPoint North America, our joint venture with ABeam Consulting, focuses on consulting\
  \ excellence and business transformation built on SAP.\n\nBearingPoint works with many of the world’s leading companies\
  \ and public-sector organizations. Together with its strategic alliance partner ABeam Consulting, the firm brings together\
  \ more than 15,000 professionals and serves clients in over 70 countries, delivering seamless business transformation, strengthening\
  \ performance, and driving sustainable impact.\n\nBearingPoint is recognized among TIME World’s Best Companies and Forbes\
  \ World’s Best Employers. The firm is also a certified B Corporation, committed to responsible business and creating long-term\
  \ value for organizations, people, and society.\n\nTogether with our colleagues from Portugal, the Czech Republic and India,\
  \ we are part of BearingPoint’s Cross-Shore Enablement Hub (CSH), which offers a wide range of expertise.\n\nWe are present\
  \ in 6 cities in Romania (Bucharest, Brasov, Cluj-Napoca, Iasi, Sibiu and Timisoara) and our team has more than 850 employees.\n\
  \nTogether, we are more than business. Join us."
